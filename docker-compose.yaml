# Projeto completo: C++, Java e Node.js (2 servidores e 2 clientes por integrante),
# todos apontando para o mesmo broker (C++).

x-cpp: &cpp
  build:
    context: .
    dockerfile: Dockerfile
  image: chat-cpp

x-java: &java
  build:
    context: .
    dockerfile: java/Dockerfile
  image: chat-java

x-node: &node
  build:
    context: .
    dockerfile: node/Dockerfile
  image: chat-node

services:
  broker:
    <<: *cpp
    command: ["/app/broker"]
    # Clientes -> 5555, servidores -> 5556 (rede interna do compose)

  # ---------------- SERVIDORES C++ ----------------
  server_cpp_1:
    <<: *cpp
    command: ["/app/server"]
    environment:
      SERVER_NAME: server_cpp_1
      BROKER_BACKEND: tcp://broker:5556
      DATA_DIR: /data
    volumes:
      - server_cpp_1_data:/data
    depends_on: [broker]

  server_cpp_2:
    <<: *cpp
    command: ["/app/server"]
    environment:
      SERVER_NAME: server_cpp_2
      BROKER_BACKEND: tcp://broker:5556
      DATA_DIR: /data
    volumes:
      - server_cpp_2_data:/data
    depends_on: [broker]

  # ---------------- CLIENTES C++ ----------------
  client_cpp_1:
    <<: *cpp
    command: ["/app/client"]
    environment:
      BOT_NAME: bot_cpp_1
      BROKER_FRONTEND: tcp://broker:5555
    depends_on: [broker, server_cpp_1, server_cpp_2]

  client_cpp_2:
    <<: *cpp
    command: ["/app/client"]
    environment:
      BOT_NAME: bot_cpp_2
      BROKER_FRONTEND: tcp://broker:5555
    depends_on: [broker, server_cpp_1, server_cpp_2]

  # ---------------- SERVIDORES JAVA ----------------
  server_java_1:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Server"]
    environment:
      SERVER_NAME: server_java_1
      BROKER_BACKEND: tcp://broker:5556
      DATA_DIR: /data
    volumes:
      - server_java_1_data:/data
    depends_on: [broker]

  server_java_2:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Server"]
    environment:
      SERVER_NAME: server_java_2
      BROKER_BACKEND: tcp://broker:5556
      DATA_DIR: /data
    volumes:
      - server_java_2_data:/data
    depends_on: [broker]

  # ---------------- CLIENTES JAVA ----------------
  client_java_1:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Client"]
    environment:
      BOT_NAME: bot_java_1
      BROKER_FRONTEND: tcp://broker:5555
    depends_on: [broker, server_java_1, server_java_2]

  client_java_2:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Client"]
    environment:
      BOT_NAME: bot_java_2
      BROKER_FRONTEND: tcp://broker:5555
    depends_on: [broker, server_java_1, server_java_2]

  # ---------------- SERVIDORES NODE ----------------
  server_node_1:
    <<: *node
    command: ["npx", "tsx", "src/server.ts"]
    environment:
      SERVER_NAME: server_node_1
      BROKER_BACKEND: tcp://broker:5556
      DATA_DIR: /data
    volumes:
      - server_node_1_data:/data
    depends_on: [broker]

  server_node_2:
    <<: *node
    command: ["npx", "tsx", "src/server.ts"]
    environment:
      SERVER_NAME: server_node_2
      BROKER_BACKEND: tcp://broker:5556
      DATA_DIR: /data
    volumes:
      - server_node_2_data:/data
    depends_on: [broker]

  # ---------------- CLIENTES NODE ----------------
  client_node_1:
    <<: *node
    command: ["npx", "tsx", "src/client.ts"]
    environment:
      BOT_NAME: bot_node_1
      BROKER_FRONTEND: tcp://broker:5555
    depends_on: [broker, server_node_1, server_node_2]

  client_node_2:
    <<: *node
    command: ["npx", "tsx", "src/client.ts"]
    environment:
      BOT_NAME: bot_node_2
      BROKER_FRONTEND: tcp://broker:5555
    depends_on: [broker, server_node_1, server_node_2]

volumes:
  server_cpp_1_data:
  server_cpp_2_data:
  server_java_1_data:
  server_java_2_data:
  server_node_1_data:
  server_node_2_data: