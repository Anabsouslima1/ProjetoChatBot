# Portas (rede interna do compose):
# broker  5555 = clientes (REQ -> ROUTER)      5556 = servidores (REP <- DEALER)
# proxy   5557 = XSUB (servidores publicam)     5558 = XPUB (bots assinam)
# Existe UM proxy Pub/Sub só, usado por todos os serviços (C++, Java e, depois, Node.js).

x-cpp: &cpp
  build:
    context: .
    dockerfile: Dockerfile
  image: chat-cpp

x-java: &java
  build:
    context: .
    dockerfile: java/Dockerfile
  image: chat-java

services:
  broker:
    <<: *cpp
    command: ["/app/broker"]

  proxy:
    <<: *cpp
    command: ["/app/proxy"]

  # SERVIDORES C++
  server_cpp_1:
    <<: *cpp
    command: ["/app/server"]
    environment:
      SERVER_NAME: server_cpp_1
      BROKER_BACKEND: tcp://broker:5556
      PROXY_XSUB: tcp://proxy:5557
      DATA_DIR: /data
    volumes:
      - server_cpp_1_data:/data
    depends_on: [broker, proxy]

  server_cpp_2:
    <<: *cpp
    command: ["/app/server"]
    environment:
      SERVER_NAME: server_cpp_2
      BROKER_BACKEND: tcp://broker:5556
      PROXY_XSUB: tcp://proxy:5557
      DATA_DIR: /data
    volumes:
      - server_cpp_2_data:/data
    depends_on: [broker, proxy]

  # CLIENTES C++
  client_cpp_1:
    <<: *cpp
    command: ["/app/client"]
    environment:
      BOT_NAME: bot_cpp_1
      BROKER_FRONTEND: tcp://broker:5555
      PROXY_XPUB: tcp://proxy:5558
    depends_on: [broker, proxy, server_cpp_1, server_cpp_2]

  client_cpp_2:
    <<: *cpp
    command: ["/app/client"]
    environment:
      BOT_NAME: bot_cpp_2
      BROKER_FRONTEND: tcp://broker:5555
      PROXY_XPUB: tcp://proxy:5558
    depends_on: [broker, proxy, server_cpp_1, server_cpp_2]

  # SERVIDORES JAVA
  server_java_1:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Server"]
    environment:
      SERVER_NAME: server_java_1
      BROKER_BACKEND: tcp://broker:5556
      PROXY_XSUB: tcp://proxy:5557
      DATA_DIR: /data
    volumes:
      - ./data/java1:/data
    depends_on: [broker, proxy]

  server_java_2:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Server"]
    environment:
      SERVER_NAME: server_java_2
      BROKER_BACKEND: tcp://broker:5556
      PROXY_XSUB: tcp://proxy:5557
      DATA_DIR: /data
    volumes:
      - ./data/java2:/data
    depends_on: [broker, proxy]

  # CLIENTES JAVA
  client_java_1:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Client"]
    environment:
      BOT_NAME: bot_java_1
      BROKER_FRONTEND: tcp://broker:5555
      PROXY_XPUB: tcp://proxy:5558
    depends_on: [broker, proxy, server_java_1, server_java_2]

  client_java_2:
    <<: *java
    command: ["java", "-cp", "app.jar", "chat.java.Client"]
    environment:
      BOT_NAME: bot_java_2
      BROKER_FRONTEND: tcp://broker:5555
      PROXY_XPUB: tcp://proxy:5558
    depends_on: [broker, proxy, server_java_1, server_java_2]

volumes:
  server_cpp_1_data:
  server_cpp_2_data: