# Override APENAS para ambientes (ex.: alguns Codespaces) em que o tráfego entre
# containers da rede bridge do Docker é bloqueado. Usa a rede do host.
#
#   docker compose -f docker-compose.yaml -f docker-compose.host.yaml up --build
#
# A entrega oficial continua sendo `docker compose up` com o docker-compose.yaml normal.

services:
  broker:
    network_mode: host

  # ========================================================================
  # INCLUSÃO PARTE 2: Serviço do Proxy Pub/Sub
  # ========================================================================
  proxy_pubsub:
    network_mode: host

  server_cpp_1:
    network_mode: host
    environment:
      BROKER_BACKEND: tcp://127.0.0.1:5556

  server_cpp_2:
    network_mode: host
    environment:
      BROKER_BACKEND: tcp://127.0.0.1:5556

  client_cpp_1:
    network_mode: host
    environment:
      BROKER_FRONTEND: tcp://127.0.0.1:5555

  client_cpp_2:
    network_mode: host
    environment:
      BROKER_FRONTEND: tcp://127.0.0.1:5555

  server_java_1:
    network_mode: host
    environment:
      BROKER_BACKEND: tcp://127.0.0.1:5556
      # INCLUSÃO PARTE 2
      PROXY_XSUB: tcp://127.0.0.1:5557

  server_java_2:
    network_mode: host
    environment:
      BROKER_BACKEND: tcp://127.0.0.1:5556
      # INCLUSÃO PARTE 2
      PROXY_XSUB: tcp://127.0.0.1:5557

  client_java_1:
    network_mode: host
    environment:
      BROKER_FRONTEND: tcp://127.0.0.1:5555
      # INCLUSÃO PARTE 2
      PROXY_XPUB: tcp://127.0.0.1:5558

  client_java_2:
    network_mode: host
    environment:
      BROKER_FRONTEND: tcp://127.0.0.1:5555
      # INCLUSÃO PARTE 2
      PROXY_XPUB: tcp://127.0.0.1:5558