// Contrato de mensagens do projeto (compartilhado por TODAS as linguagens do grupo).
// Qualquer alteração aqui deve ser combinada com o grupo.
syntax = "proto3";

package chat;

option java_package = "chat.proto";
option java_multiple_files = true;

enum ErrorCode {
  ERROR_NONE = 0;
  ERROR_INVALID_USERNAME = 1;      // vazio, muito longo ou com caracteres inválidos
  ERROR_INVALID_CHANNEL_NAME = 2;  // idem para canais
  ERROR_CHANNEL_EXISTS = 3;        // canal duplicado
  ERROR_UNKNOWN_REQUEST = 4;       // mensagem não reconhecida
  ERROR_INTERNAL = 5;              // falha interna (ex.: disco)
  ERROR_CHANNEL_NOT_FOUND = 6;     // canal inexistente (reservado: os servidores aceitam qualquer nome válido)
  ERROR_INVALID_MESSAGE = 7;       // texto da publicação vazio ou com mais de 1000 bytes
}

// ---- Parte 1: login e canais ----

message LoginRequest {
  string username = 1;
}

message LoginResponse {
  bool success = 1;
  ErrorCode error = 2;
  string error_message = 3;
}

message CreateChannelRequest {
  string channel_name = 1;
}

message CreateChannelResponse {
  bool success = 1;
  ErrorCode error = 2;
  string error_message = 3;
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated string channels = 1;
}

// ---- Parte 2: publicação em canais ----

// Bot -> Servidor (REQ/REP)
message PublishRequest {
  string channel = 1;
  string message = 2;
}

message PublishResponse {
  bool success = 1;
  ErrorCode error = 2;
  string error_message = 3;
}

// Servidor -> Canal (PUB/SUB). Vai no segundo frame; o primeiro frame é o
// nome do canal (tópico). O timestamp de envio está no Envelope.
message Publication {
  string channel = 1;
  string message = 2;
  string author = 3;   // bot que pediu a publicação
}

// ---- Parte 3: relógios e heartbeat (serviço de referência) ----

// Servidor -> Referência (REQ/REP): pede o rank. Resposta: RankResponse.
message RankRequest {
  string name = 1;          // nome do servidor
}

message RankResponse {
  int32 rank = 1;
}

// Servidor -> Referência (REQ/REP): lista os servidores disponíveis.
message ListServersRequest {}

message ServerInfo {
  string name = 1;
  int32 rank = 2;
}

message ListServersResponse {
  repeated ServerInfo servers = 1;
}

// Servidor -> Referência (REQ/REP): heartbeat + pedido da hora correta.
// A resposta traz "OK" (success) e a hora da referência em time_ms (epoch ms, UTC).
message HeartbeatRequest {
  string name = 1;
}

message HeartbeatResponse {
  bool success = 1;         // true = "OK" (servidor mantido na lista)
  int64 time_ms = 2;        // hora correta, segundo a referência
}

// Todo mensagem trafega dentro de um Envelope, que garante o timestamp
// obrigatório do envio. Serialização: Protocol Buffers (binário).
message Envelope {
  int64 timestamp_ms = 1;  // epoch em milissegundos (UTC) do momento do envio
  string sender = 2;       // nome do bot ou do servidor que enviou
  int64 logical_clock = 3; // relógio lógico de quem envia (Parte 3)

  oneof body {
    LoginRequest login_request = 10;
    LoginResponse login_response = 11;
    CreateChannelRequest create_channel_request = 12;
    CreateChannelResponse create_channel_response = 13;
    ListChannelsRequest list_channels_request = 14;
    ListChannelsResponse list_channels_response = 15;
    PublishRequest publish_request = 16;
    PublishResponse publish_response = 17;
    Publication publication = 18;
    RankRequest rank_request = 19;
    RankResponse rank_response = 20;
    ListServersRequest list_servers_request = 21;
    ListServersResponse list_servers_response = 22;
    HeartbeatRequest heartbeat_request = 23;
    HeartbeatResponse heartbeat_response = 24;
  }
}
